name: church_theatre_app
description: "تطبيق فريق المسرح الكنسي - خيمة مسرح حي"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # إدارة الحالة والبيانات Local
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

  # عرض ملفات السكريبت والتقسيمة PDF
  syncfusion_flutter_pdfviewer: ^24.2.7
  file_picker: ^8.0.0

  # تشغيل الموسيقى والصوتيات
  audioplayers: ^5.2.1

  # الأيقونات والتصميم
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

# إعدادات توليد آيقونة التطبيق الجديدة
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # تعريف المجلدات والصور
  assets:
    - icon.png
